services:
  tripservice:
    build:
      context: .
      dockerfile: src/TripService/TripService.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - platform-net

  bookingservice:
    build:
      context: .
      dockerfile: src/BookingService/BookingService.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - platform-net

  notificationservice:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - platform-net

networks:
  platform-net:
    driver: bridge
