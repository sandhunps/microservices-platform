services:
  tripservice:
    build:
      context: .
      dockerfile: src/TripService/TripService.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__TripDb=Host=postgres;Port=5432;Database=tripsdb;Username=admin;Password=secret
    networks:
      - platform-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bookingservice:
    build:
      context: .
      dockerfile: src/BookingService/BookingService.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BookingDb=Host=postgres-booking;Port=5432;Database=bookingsdb;Username=admin;Password=secret
    networks:
      - platform-net
    depends_on:
      postgres-booking:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  notificationservice:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=tripsdb
    networks:
      - platform-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tripsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-booking:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=bookingsdb
    networks:
      - platform-net
    volumes:
      - postgres-booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookingsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  platform-net:
    driver: bridge

volumes:
  postgres-data:
  postgres-booking-data: